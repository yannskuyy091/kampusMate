name: KampusMate Auto Presensi

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install playwright requests python-dotenv

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Generate .env file
        run: |
          echo "SIPT_EMAIL=${{ secrets.SIPT_EMAIL }}" >> backend/.env
          echo "SIPT_PASSWORD=${{ secrets.SIPT_PASSWORD }}" >> backend/.env
          echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" >> backend/.env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> backend/.env

      - name: Init Database Tables
        run: |
          python -c "import sys; sys.path.append('backend'); from app.core.database import engine, Base; from app.models.jadwal import JadwalKuliah; Base.metadata.create_all(bind=engine)"

      - name: Run Attendance Bot
        run: |
          python workers/presensi_bot/main_bot.py